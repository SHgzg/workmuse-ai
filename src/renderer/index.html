<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' ws: http://localhost:*" />
    <title>WorkMuse 安装助手</title>
  </head>
  <body>
    <main class="installer-shell">
      <aside class="brand-panel" aria-label="WorkMuse 简介">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M11 12.5 20 7l9 5.5v15L20 33l-9-5.5z"/><path d="m15.5 17 4.5-2.7 4.5 2.7v6L20 25.7 15.5 23z" class="brand-mark-core"/></svg></div>
          <div><strong>WorkMuse</strong><span>AI 工作助手</span></div>
        </div>
        <div class="brand-copy">
          <p class="eyebrow">专注 · 整理 · 创造</p>
          <h1>让每一次更新，<br/>都更接近灵感。</h1>
          <p>保持 WorkMuse 为最新版本，获得更流畅、稳定的智能工作体验。</p>
        </div>
        <ol class="steps" aria-label="更新流程">
          <li class="is-complete"><span>1</span>检查版本</li>
          <li class="is-current"><span>2</span>下载更新</li>
          <li><span>3</span>完成安装</li>
        </ol>
      </aside>

      <section class="content-panel">
        <header class="window-heading"><span>安装助手</span><span class="secure-label"><i aria-hidden="true"></i>安全更新</span></header>
        <div class="content-body">
          <div class="app-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M13 15.2 24 8.5l11 6.7v17.6l-11 6.7-11-6.7z"/><path d="m18.7 20.5 5.3-3.2 5.3 3.2v7L24 30.7l-5.3-3.2z" class="app-icon-core"/></svg></div>
          <div class="title-row">
            <div><p class="section-label">WORKMUSE DESKTOP</p><h2>准备更新</h2></div>
            <span class="version-badge">当前 <span id="version">…</span></span>
          </div>
          <section id="status-card" class="status-card status-idle" aria-live="polite">
            <div class="status-icon" aria-hidden="true">
              <svg class="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6.1 9A7 7 0 0 1 18.7 7.2L20 9M4 15l1.3 1.8A7 7 0 0 0 17.9 15"/></svg>
              <svg class="icon-check" viewBox="0 0 24 24"><path d="m6 12 4 4 8-9"/></svg>
              <svg class="icon-alert" viewBox="0 0 24 24"><path d="M12 8v5M12 17h.01M10.3 4.8 3.1 17.2A2 2 0 0 0 4.8 20h14.4a2 2 0 0 0 1.7-2.8L13.7 4.8a2 2 0 0 0-3.4 0Z"/></svg>
            </div>
            <div class="status-copy"><strong id="status">正在初始化…</strong><span id="status-detail">正在确认你的版本信息</span></div>
            <span id="progress-value" class="progress-value" hidden>0%</span>
            <progress id="progress" max="100" value="0" hidden></progress>
          </section>
          <div class="actions">
            <button id="check" class="secondary" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 9A7 7 0 0 1 18.7 7.2L20 9M4 15l1.3 1.8A7 7 0 0 0 17.9 15"/></svg>检查更新</button>
            <button id="install" class="primary" type="button" hidden>重启并安装<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
          <p class="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v4l2.5 2.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>下载完成后，你可以立即安装，或在退出应用时自动完成更新。</p>
        </div>
        <footer>© 2026 WorkMuse <span></span> 智能、高效、始终为你准备</footer>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
